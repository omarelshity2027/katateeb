function delT(id){const n=SS().filter(s=>s.teacherIds.includes(id)).length;askPin('حذف الشيخ',()=>conf(`حذف الشيخ${n?` (له ${n} طالب)`:''}؟`,()=>{DB.D.teachers=TS().filter(t=>t.id!==id);DB.w(DB.ref('teachers/'+id).remove());tl()}))}
/* ===== استيراد Excel: طلاب + مشايخ ===== */
const colv=(r,a)=>{for(const k of a)if(r[k]!==undefined&&String(r[k]).trim()!=='')return String(r[k]).trim();return''};
const splitT=s=>String(s||'').split(/[،,؛;\/+|\n]/).map(z=>z.trim()).filter(Boolean);
const fixPh=p=>/^1[0-25]\d{8}$/.test(p)?'0'+p:p;
async function codesN(n){const mx=Math.max(0,...SS().map(s=>+((String(s.code||'').match(/(\d+)$/)||[0,0])[1])));try{const r=await DB.ref('counter').transaction(c=>Math.max(c||0,mx)+n);return r.snapshot.val()-n+1}catch(x){return mx+1}}
function tpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['الاسم','النوع','الشيخ','السورة','الهاتف','ملاحظات'],['محمد أحمد','ذكر','الشيخ عمر','النبأ','01000000000',''],['محمد أحمد','ذكر','الشيخ علي','النبأ','',''],['فاطمة محمود','أنثى','الشيخ علي','الملك','','']]),'الطلاب');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['الاسم','الهاتف'],['الشيخ عمر','01000000001'],['الشيخ علي','']]),'المشايخ');XLSX.writeFile(wb,'نموذج-استيراد.xlsx')}
/* الطالب ممكن يتكرر في أكتر من صف (كل صف بشيخ) وبيتجمعوا في طالب واحد بكل مشايخه */
function impFile(f){if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{
  const wb=XLSX.read(ev.target.result,{type:'array'}),sh=wb.SheetNames.find(n=>n.trim()==='المشايخ'),main=wb.SheetNames.find(n=>n.trim()!=='المشايخ')||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[main],{defval:''}),G={},tch=[];let bad=0;
  if(sh)XLSX.utils.sheet_to_json(wb.Sheets[sh],{defval:''}).forEach(r=>{const n=colv(r,['الاسم','الشيخ','اسم الشيخ']);if(n)tch.push({name:n,phone:fixPh(colv(r,['الهاتف','رقم الهاتف']))})});
  rows.forEach(r=>{const name=colv(r,['الاسم','اسم الطالب','الطالب']),n=nn(name);if(!n){if(Object.values(r).some(v=>String(v).trim()))bad++;return}
    const g=colv(r,['النوع']),x=G[n]=G[n]||{name,gender:'',phone:'',notes:'',tn:[],rows:0,surRaw:'',lvl:''};x.rows++;
    x.gender=x.gender||(/أنث|انث|بنت/.test(g)?'أنثى':/ذكر|ولد|بنين/.test(g)?'ذكر':'');x.phone=x.phone||fixPh(colv(r,['الهاتف','رقم الهاتف']));x.notes=x.notes||colv(r,['ملاحظات']);x.surRaw=x.surRaw||colv(r,['السورة','السوره','آخر سورة','السورة الحالية']);x.lvl=x.lvl||colv(r,['المستوى']);
    splitT(colv(r,['الشيخ','المشايخ','المحفظ','المحفظون','المحفظين'])).forEach(t=>{if(!x.tn.some(z=>nn(z)===nn(t)))x.tn.push(t)})});
  const list=Object.entries(G).map(([n,x])=>{const ex=SS().find(s=>nn(s.name)===n);x.sur=x.surRaw?findSur(x.surRaw):'';x.lv=(LV.find(l=>nn(l[0])===nn(x.lvl))||[''])[0];
    if(!ex){x.s='جديد';x.add=x.tn}else{x.ex=ex.id;x.add=x.tn.filter(t=>{const o=TS().find(z=>nn(z.name)===nn(t));return!(o&&ex.teacherIds.includes(o.id))});x.fill=!!((!ex.surah&&x.sur)||(!ex.level&&x.lv));x.s=x.add.length||x.fill?'تحديث':'موجود'}return x});
  st.imp={list,tch,bad};showImp()}catch(x){tst('تعذر قراءة الملف، تأكد من صيغته',1)}};rd.readAsArrayBuffer(f)}
function showImp(){const{list,tch,bad}=st.imp,c=z=>list.filter(x=>x.s===z).length,names=[...new Set([...tch.map(t=>t.name),...list.flatMap(x=>x.add)])],nw=names.filter(n=>!TS().some(t=>nn(t.name)===nn(n))),ns=list.filter(x=>x.s==='جديد'&&!x.tn.length).length,us=list.filter(x=>x.surRaw&&x.sur===null);
  $('#ip').innerHTML=`<p>طلاب جدد: <b class="ok">${c('جديد')}</b> — طلاب موجودين هيتضاف لهم شيوخ: <b class="wr">${c('تحديث')}</b> — موجودين بدون تغيير: <b class="mu">${c('موجود')}</b>${bad?` — صفوف بدون اسم (اتتخطت): <b class="no">${bad}</b>`:''}<br>مشايخ جدد هيتضافوا: <b>${nw.length}</b>${nw.length?' ('+e(nw.join('، '))+')':''}${ns?`<br><span class="wr">${ns} طالب جديد بدون شيخ</span>`:''}${us.length?`<br><span class="no">${us.length} طالب سورتهم غير معروفة (هيتسجلوا بدون مستوى): ${e(us.slice(0,5).map(x=>x.surRaw).join('، '))}</span>`:''}</p>
  <div class="tw"><table><tr><th>الاسم</th><th>النوع</th><th>السورة</th><th>المستوى</th><th>المشايخ</th><th>الحالة</th></tr>${list.slice(0,100).map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.gender)}</td><td>${e(x.sur||x.surRaw||'')}</td><td>${e(x.lv||autoLevel(x.sur||'')||'—')}</td><td>${e(x.s==='تحديث'?'+ '+x.add.join('، '):x.tn.join('، '))}</td><td class="${x.s==='جديد'?'ok':x.s==='تحديث'?'wr':'mu'}">${x.s}</td></tr>`).join('')}</table></div>${list.length>100?'<p class="mu">معروض أول 100 طالب فقط، والاستيراد يشمل الكل.</p>':''}<button class="p" style="margin-top:10px" onclick="impOk()">تأكيد الاستيراد</button>`}
async function impOk(){const all=st.imp.list.filter(x=>x.s==='جديد'||x.s==='تحديث'),nw=all.filter(x=>x.s==='جديد'),up=all.filter(x=>x.s==='تحديث'),tch=st.imp.tch;if(!all.length&&!tch.length)return tst('مفيش حاجة للاستيراد',1);
  st.imp=null;const u={},nt=[],mk=(n,ph)=>{let t=TS().find(t=>nn(t.name)===nn(n))||nt.find(t=>nn(t.name)===nn(n));if(!t){t={id:uid('T'),name:n,phone:ph||''};nt.push(t)}return t};
  tch.forEach(t=>mk(t.name,t.phone));
  const c0=await codesN(nw.length),now=new Date().toISOString(),ns=nw.map((x,i)=>norm({id:uid('S'),code:'K-'+String(c0+i).padStart(4,'0'),name:x.name,gender:x.gender,phone:x.phone,notes:x.notes,teacherIds:[...new Set(x.tn.map(n=>mk(n).id))],surah:x.sur||'',level:x.lv||'',reg:now})),ups=[];
  up.forEach(x=>{const s=SS().find(z=>z.id===x.ex);if(!s)return;const ids=[...new Set([...s.teacherIds,...x.add.map(n=>mk(n).id)])];ups.push([s,ids,x]);u[DB.pre+'students/'+s.id+'/teacherIds']=ids;if(!s.surah&&x.sur)u[DB.pre+'students/'+s.id+'/surah']=x.sur;if(!s.level&&x.lv)u[DB.pre+'students/'+s.id+'/level']=x.lv});
  nt.forEach(t=>u[DB.pre+'teachers/'+t.id]=t);ns.forEach(s=>u[DB.pre+'students/'+s.id]=clean(s));
  try{await DB.db.ref().update(u)}catch(x){return tst('تعذر الاستيراد',1)}
  nt.forEach(t=>{if(!TS().some(z=>z.id===t.id))TS().push(t)});ns.forEach(s=>{if(!SS().some(z=>z.id===s.id))SS().push(s)});ups.forEach(([s,ids,x])=>{const c=SS().find(z=>z.id===s.id);if(c){c.teacherIds=ids;if(!c.surah&&x.sur)c.surah=x.sur;if(!c.level&&x.lv)c.level=x.lv}});tst(`تم: ${ns.length} طالب جديد، وإضافة شيوخ لـ ${ups.length} طالب، و${nt.length} شيخ جديد`);go('students')}
/* ===== التقارير: بطلاب شيخ واحد ودرجاتهم عنده بس ===== */
function repRows(){const t=st.rt,f=st.rf||'',q=nn(st.q).toLowerCase(),ids=s=>(t?[t]:s.teacherIds).filter(tname),
  sc=s=>{const a=ids(s).map(i=>EV(s.id,i)).filter(Boolean);return a.length?Math.max(...a.map(v=>v.pct)):-1};
  const r=SS().filter(s=>(!t||s.teacherIds.includes(t))&&nn(s.name+' '+s.code).toLowerCase().includes(q)&&(!f||ids(s).some(i=>res(EV(s.id,i))===f))&&(!st.rlv||levelOf(s)===st.rlv)&&(!st.rg||s.gender===st.rg)),by=st.rs||(t?'score':'name');
  return r.sort((a,b)=>by==='score'?(sc(b)-sc(a))||cmp(a,b):cmp(a,b))}
const stats=(r,t)=>{const x=r.flatMap(s=>(t?[t]:s.teacherIds).filter(tname).map(i=>res(EV(s.id,i)))),c=y=>x.filter(z=>z===y).length;return{n:r.length,d:x.length-c('لم يُختبر'),ok:c('ناجح'),no:c('راسب')}};
/* لو اخترت شيخ: درجته بس. من غير شيخ: نتائج الطالب عند كل مشايخه */
const rth=t=>t?'<th>الدرجة</th><th>الحالة</th><th>ملاحظات</th>':'<th>النتائج عند المشايخ</th>';
const rcells=(s,t)=>{if(!t)return`<td>${s.teacherIds.filter(tname).map(i=>{const v=EV(s.id,i);return`${e(tname(i))}: ${v?v.pct+'% '+res(v):'—'}`}).join('<br>')||'—'}</td>`;const v=EV(s.id,t);return`<td>${v?v.pct+'%':'-'}</td><td class="${cls(res(v))}">${res(v)}</td><td>${e(v?.note||'')}</td>`};
const repTitle=()=>[st.rt?'الشيخ: '+tname(st.rt):'كل المشايخ',st.rlv?'المستوى: '+st.rlv:'',st.rf?'الحالة: '+st.rf:'',st.rg?(st.rg==='ذكر'?'بنين':'بنات'):'',st.q?'بحث: '+st.q:''].filter(Boolean).join(' • ');
function rep(){const el=$('#rp');if(!el)return;const t=st.rt,r=repRows(),k=stats(r,t);
  el.innerHTML=`<p class="mu">${e(repTitle())} — ${k.n} طالب، نتائج مسجلة ${k.d}، ناجح ${k.ok}، راسب ${k.no}</p><table><tr><th>م</th><th>الاسم</th><th>النوع</th><th>المستوى</th>${rth(t)}<th></th></tr>${r.map((s,i)=>`<tr><td>${i+1}</td><td>${e(s.name)}</td><td>${e(s.gender)}</td><td>${e(levelOf(s))}</td>${rcells(s,t)}<td><button onclick="printRes('${s.id}')" title="طباعة نتيجة الطالب عند كل المشايخ">🖨</button></td></tr>`).join('')||'<tr><td colspan="9" class="mu">لا توجد نتائج</td></tr>'}</table>`}
function exXl(){const t=st.rt,r=repRows(),T=t?[]:[...new Set(r.flatMap(s=>s.teacherIds.filter(tname)))].map(i=>({id:i,n:tname(i)})).sort((a,b)=>nn(a.n).localeCompare(nn(b.n),'ar'));
  const rows=r.map((s,i)=>{const o={'م':i+1,'الاسم':s.name,'الكود':s.code,'النوع':s.gender,'السورة':s.surah||'','المستوى':levelOf(s)};
    if(t){const v=EV(s.id,t);o['الدرجة']=v?v.pct:'';o['الحالة']=res(v);o['ملاحظات']=v?.note||''}
    else T.forEach(x=>{o['الشيخ '+x.n]=s.teacherIds.includes(x.id)?(EV(s.id,x.id)?EV(s.id,x.id).pct:'لم يُختبر'):''});return o});
  try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'التقرير');XLSX.writeFile(wb,'report-'+(t?tname(t):'all')+'.xlsx')}catch(x){tst('تعذر التصدير',1)}}
async function pr(h){$('#pg').textContent='@page{size:A4 portrait;margin:11mm 10mm 13mm}';$('#pr').innerHTML=h;try{await document.fonts.load('700 20px Amiri','بسم')}catch(x){}window.print()}
const rh=t=>`<div class="rh"><div><small>${e(ST().org)}</small><h1>${e(ST().name)}</h1></div><div style="text-align:left"><h1>${e(ST().year)}</h1><small>${t}</small></div></div>`;
function printRep(){const t=st.rt,r=repRows(),k=stats(r,t);
  pr(`${rh(t?'تقرير الشيخ: '+e(tname(t)):'تقرير النتائج')}<p style="font-size:10pt;margin:3mm 0"><b>${e(repTitle())}</b><br>عدد الطلاب: <b>${k.n}</b> — نتائج مسجلة: <b>${k.d}</b> — ناجح: <b>${k.ok}</b> — راسب: <b>${k.no}</b></p><table><thead><tr><th>م</th><th>الاسم</th><th>النوع</th><th>المستوى</th>${rth(t)}</tr></thead><tbody>${r.map((s,i)=>`<tr><td>${i+1}</td><td><b>${e(s.name)}</b></td><td>${e(s.gender)}</td><td>${e(levelOf(s))}</td>${rcells(s,t)}</tr>`).join('')}</tbody></table><div class="rd">تاريخ الطباعة: ${new Date().toLocaleDateString('ar-EG')}</div>`)}
function printRes(sid,tid){const s=SS().find(x=>x.id===sid),ids=(tid?[tid]:s.teacherIds).filter(tname);
  pr(`${rh('نتيجة طالب')}<p style="margin:4mm 0;font-size:11pt"><b style="font-size:15pt">${e(s.name)}</b> — الكود: ${e(s.code)} — ${e(s.gender)} — المستوى: ${e(levelOf(s)||'-')}</p><table><thead><tr><th>الشيخ</th><th>الدرجة</th><th>الحالة</th><th>ملاحظات</th><th>التاريخ</th></tr></thead><tbody>${ids.map(t=>{const v=EV(sid,t);return`<tr><td>${e(tname(t))}</td><td>${v?v.pct+'%':'-'}</td><td>${res(v)}</td><td>${e(v?.note||'')}</td><td>${v?new Date(v.at).toLocaleDateString('ar-EG'):'-'}</td></tr>`}).join('')}</tbody></table><div class="rd">تاريخ الطباعة: ${new Date().toLocaleDateString('ar-EG')}</div>`)}
/* ===== إعدادات ===== */
async function saveSet(){const o={name:$('#s_name').value,org:$('#s_org').value,year:+$('#s_year').value||0,pass:+$('#s_pass').value||0,dir:$('#s_dir').value,rule:$('#s_rule').value};if(o.pass<0||o.pass>100)return tst('نسبة النجاح بين 0 و100',1);Object.assign(ST(),o);DB.w(DB.ref('settings').update(o));tst('تم الحفظ');draw()}
async function setPin(){const p=$('#s_pin').value.trim();if(p.length<4)return tst('الرقم السري 4 خانات على الأقل',1);
  try{await DB.ref('secret').set(String(p))}catch(x){return tst('الرقم السري متعين بالفعل في Firebase: احذف katateeb/secret من الـ Console ثم أعد المحاولة',1)}
  ST().pinHash=hp(p);DB.w(DB.ref('settings').update({pinHash:ST().pinHash}));st.admin=true;try{sessionStorage.setItem('k_admin','1')}catch(x){}tst('تم حفظ الرقم السري');draw()}
function backup(t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({at:new Date().toISOString(),students:SS(),teachers:TS(),evs:DB.D.evs,settings:{...ST(),pinHash:undefined}})],{type:'application/json'}));a.download=`katateeb-${t}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}
function wipeAll(){askPin('حذف كل البيانات',()=>modal(`<h3 class="no">حذف كل البيانات</h3><p>هيتنزل نسخة احتياطية أولًا. اكتب كلمة <b>حذف</b> للتأكيد:</p><input id="wp"><div class="row" style="margin-top:14px"><button class="d" onclick="wipeGo()">حذف كل شيء</button><button onclick="closeM()">إلغاء</button></div>`))}
async function wipeGo(){if($('#wp').value.trim()!=='حذف')return tst('اكتب كلمة حذف',1);backup('before-wipe');
  try{await DB.ref('students').remove();await DB.ref('teachers').remove();try{await DB.ref('evs').remove()}catch(x){}DB.D.students=[];DB.D.teachers=[];DB.D.evs={};closeM();tst('تم الحذف');go('home')}catch(x){tst('تعذر الحذف',1)}}
$('#mn').innerHTML='<p class="mu">جاري تحميل البيانات...</p>';
DB.load().then(draw).catch(()=>{$('#mn').innerHTML='<div class="card no">تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت ومن قواعد Realtime Database.</div>'});
