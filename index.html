<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسابقة الكتاتيب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style id="pg"></style>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1c2a22;--mu:#6b7a70;--g:#14532d;--au:#b8912f;--bd:#e2e6e0;--ok:#166534;--no:#b91c1c;--wr:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
#top{background:var(--g);color:#f6f0df;padding:8px 12px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--au)}
#top h1{margin:0 0 0 10px;font-size:19px;font-family:Amiri,serif}
#top a{padding:7px 12px;border-radius:9px;cursor:pointer}#top a.on{background:#f6f0df;color:var(--g);font-weight:700}
main{max-width:980px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st b{display:block;font-size:26px;color:var(--g)}.st span{color:var(--mu);font-size:14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:10px;cursor:pointer}
.p{background:var(--g);color:#fff;border-color:var(--g)}.d{color:var(--no)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row .f{flex:1 1 150px}
.s{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px;border:1px solid var(--bd);border-radius:12px;margin-top:8px}
.big{font-size:52px;font-weight:700;text-align:center;color:var(--g)}
.ok{color:var(--ok)}.no{color:var(--no)}.wr{color:var(--wr)}.mu{color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#md>div{background:var(--card);border-radius:16px;padding:18px;max-width:500px;width:100%;max-height:90vh;overflow:auto}
#ts{position:fixed;bottom:20px;inset-inline:0;text-align:center;z-index:10;pointer-events:none}
#ts span{background:var(--g);color:#fff;padding:12px 20px;border-radius:12px;display:none}#ts span.er{background:var(--no)}
#pr{display:none}
@media print{#top,main,#md,#ts{display:none!important}#pr{display:block;color:#000;background:#fff}:root{padding:0!important}body{background:#fff}}
#pr,#pr *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
#pr .rh{background:#14532d;color:#f6f0df;border-bottom:1.2mm solid #b8912f;border-radius:2mm;padding:4mm 5mm;display:flex;justify-content:space-between;align-items:center}
#pr .rh h1{margin:0;font-size:17pt;font-family:Amiri,serif}#pr .rh small{display:block;color:#e7d9a8;font-size:9.5pt}
#pr table{font-size:9.5pt;margin-top:4mm}#pr th{background:#14532d;color:#f6f0df;padding:2mm;border:0}
#pr td{padding:1.6mm 2mm;border-bottom:.2mm solid #e3dcc3;vertical-align:top}#pr tr{break-inside:avoid}#pr thead{display:table-header-group}
#pr tbody tr:nth-child(even) td{background:#faf6e8}#pr .rd{text-align:center;margin-top:5mm;font-size:8.5pt;color:#8a8f80}
</style></head><body>
<div id="top"></div><main id="mn"></main>
<div id="md"><div id="mb"></div></div><div id="ts"><span id="tx"></span></div><div id="pr"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCcAw9uCR8YZKzfLrBWg5ZwjhzBj2CSWyI",authDomain:"qraan-eb167.firebaseapp.com",databaseURL:"https://qraan-eb167-default-rtdb.firebaseio.com",projectId:"qraan-eb167",storageBucket:"qraan-eb167.firebasestorage.app",messagingSenderId:"742225987824",appId:"1:742225987824:web:7b033870f0188b9b1c1a35"};
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nn=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const clean=o=>JSON.parse(JSON.stringify(o)),ls=k=>{try{return localStorage.getItem(k)||''}catch(x){return''}};
let _u=0;const uid=p=>p+Date.now().toString(36)+(_u++).toString(36)+Math.random().toString(36).slice(2,4);
const norm=o=>({...o,teacherIds:o.teacherIds||[],evs:o.evs||{}});
const DEF={name:'مسابقة الكتاتيب',org:'',year:new Date().getFullYear(),pass:60};
/* ===== البيانات: مسار منفصل katateeb/ داخل Firebase ===== */
const DB={D:{students:[],teachers:[],settings:{}},pre:'katateeb/',
  ref(p){return this.db.ref(this.pre+p)},
  w(p){return p.catch(()=>tst('حدث خطأ أثناء الحفظ، حاول مرة أخرى',1))},
  async load(){firebase.initializeApp(firebaseConfig);this.db=firebase.database();
    const [a,b,c]=await Promise.all(['students','teachers','settings'].map(k=>this.ref(k).once('value')));
    this.D.students=Object.values(a.val()||{}).map(norm);this.D.teachers=Object.values(b.val()||{});
    let s=c.val();if(!s||!s.name){s={...DEF};await this.ref('settings').set(s)}this.D.settings=s;
    ['students','teachers'].forEach(k=>{const r=this.ref(k),up=x=>{const o=k==='students'?norm(x.val()):x.val(),l=this.D[k],i=l.findIndex(z=>z.id===o.id);if(i<0)l.push(o);else if(JSON.stringify(l[i])!==JSON.stringify(o))l[i]=o;else return;this.redraw()};
      r.on('child_added',up);r.on('child_changed',up);r.on('child_removed',x=>{const l=this.D[k],i=l.findIndex(z=>z.id===x.key);if(i>=0){l.splice(i,1);this.redraw()}})});
    this.ref('settings').on('value',x=>{if(x.val()){this.D.settings=x.val();if(st.v!=='settings')this.redraw()}})},
  redraw(){clearTimeout(this._t);this._t=setTimeout(rd,400)},
  async code(){const mx=Math.max(0,...SS().map(s=>+((String(s.code||'').match(/(\d+)$/)||[0,0])[1])));let n;
    try{n=(await this.ref('counter').transaction(c=>Math.max(c||0,mx)+1)).snapshot.val()}catch(x){n=mx+1}return'K-'+String(n).padStart(4,'0')}};
const ST=()=>DB.D.settings,SS=()=>DB.D.students,TS=()=>DB.D.teachers;
/* ===== منطق ===== */
const gr=s=>s.gender==='ذكر'?0:s.gender==='أنثى'?1:2;
const cmp=(a,b)=>gr(a)-gr(b)||nn(a.name).localeCompare(nn(b.name),'ar');   // بنين أولًا ثم أبجديًا
const tname=id=>(TS().find(t=>t.id===id)||{}).name;
const tsel=sel=>[...TS()].sort((a,b)=>nn(a.name).localeCompare(nn(b.name),'ar')).map(t=>`<option value="${e(t.id)}" ${t.id===sel?'selected':''}>${e(t.name)}</option>`).join('');
/* النتيجة النهائية = متوسط درجات كل المشايخ، وتكتمل بعد اختبار كل شيخ */
const info=s=>{const ids=s.teacherIds.filter(tname),d=ids.filter(i=>s.evs[i]),n=ids.length,avg=d.length?Math.round(d.reduce((a,i)=>a+s.evs[i].pct,0)/d.length*10)/10:null;
  return{n,d:d.length,avg,st:!n?'بدون شيخ':!d.length?'لم يبدأ':d.length<n?'ناقص':avg>=ST().pass?'ناجح':'راسب'}};
const cls=x=>({'ناجح':'ok','راسب':'no','ناقص':'wr'}[x]||'mu');
const scs=s=>s.teacherIds.filter(tname).map(t=>`${e(tname(t))}: ${s.evs[t]?s.evs[t].pct+'%':'—'}`).join('<br>');
function search(q,f,by){const tk=nn(q).toLowerCase().split(' ').filter(Boolean);
  return SS().filter(s=>{const i=info(s),h=nn([s.name,s.teacherIds.map(tname).join(' '),s.code,s.phone].join(' ')).toLowerCase();
    return tk.every(t=>h.includes(t))&&(!f.teacher||s.teacherIds.includes(f.teacher))&&(!f.gender||s.gender===f.gender)&&(!f.st||i.st===f.st||(f.st==='مكتمل'&&(i.st==='ناجح'||i.st==='راسب')))&&(!f.tc||(f.tc==='1'?i.n===1:i.n>1))})
  .sort((a,b)=>by==='score'?((info(b).avg??-1)-(info(a).avg??-1)||cmp(a,b)):cmp(a,b))}
/* ===== واجهة ===== */
let st={v:'home',id:null,q:'',q2:'',f:{},sf:{},n:50,my:ls('k_my')};
const tst=(t,er)=>{const x=$('#tx');x.textContent=t;x.className=er?'er':'';x.style.display='inline-block';clearTimeout(tst.t);tst.t=setTimeout(()=>x.style.display='none',3000)};
const modal=h=>{$('#mb').innerHTML=h;$('#md').style.display='flex'},closeM=()=>$('#md').style.display='none';
const conf=(m,fn)=>{window._cf=()=>{closeM();fn()};modal(`<h3>هل أنت متأكد؟</h3><p>${m}</p><div class="row"><button class="d" onclick="_cf()">تأكيد</button><button onclick="closeM()">إلغاء</button></div>`)};
const go=(v,id)=>{st.v=v;st.id=id||null;scrollTo(0,0);draw()};
const NAV=[['home','الرئيسية'],['my','شاشة الشيخ'],['students','الطلاب'],['teachers','المشايخ'],['reports','التقارير'],['settings','الإعدادات']];
function draw(){$('#top').innerHTML=`<h1>${e(ST().name)}</h1>`+NAV.map(n=>`<a class="${st.v===n[0]||(st.v==='student'&&n[0]==='students')?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
  $('#mn').innerHTML=V[st.v]();if(V[st.v+'_'])V[st.v+'_']()}
function rd(){if(st.v==='students')renderList();else if(st.v==='my')renderMy();else if(st.v==='teachers')tl();else if(st.v==='reports')rep();else if(st.v!=='settings')draw()}
const stOpts=(v,a)=>a.map(([x,l])=>`<option value="${x}" ${v===x?'selected':''}>${l}</option>`).join('');
const SO=[['','كل الحالات'],['لم يبدأ','لم يبدأ'],['ناقص','ناقص (شيخ لم يختبر)'],['مكتمل','مكتمل'],['ناجح','ناجح'],['راسب','راسب']];
const V={
home(){const a=SS(),is=a.map(info),need=is.reduce((x,i)=>x+i.n,0),done=is.reduce((x,i)=>x+i.d,0),c=x=>is.filter(i=>i.st===x).length,
  k=[['الطلاب',a.length],['المشايخ',TS().length],['اختبارات مطلوبة',need],['تمت',done],['متبقية',need-done],['ناجح',c('ناجح')],['راسب',c('راسب')],['ناقص',c('ناقص')],['لم يبدأ',c('لم يبدأ')]];
  return`<div class="grid">${k.map(x=>`<div class="card st"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
  <div class="card tw"><table><tr><th>الشيخ</th><th>طلابه</th><th>اختبرهم</th><th>متبقي</th></tr>${TS().map(t=>{const m=a.filter(s=>s.teacherIds.includes(t.id)),d=m.filter(s=>s.evs[t.id]).length;return`<tr><td>${e(t.name)}</td><td>${m.length}</td><td>${d}</td><td class="${m.length-d?'wr':'ok'}">${m.length-d}</td></tr>`}).join('')}</table></div>`},
my(){const t=st.my;return`<h2>شاشة الشيخ</h2><div class="card"><label>أنا الشيخ</label><select onchange="st.my=this.value;try{localStorage.setItem('k_my',this.value)}catch(x){}draw()"><option value="">— اختر اسمك —</option>${tsel(t)}</select>${t&&tname(t)?`<input style="margin-top:10px" placeholder="بحث باسم الطالب" oninput="st.q2=this.value;renderMy()"><div id="my"></div>`:''}</div>`},
my_(){renderMy()},
students(){const f=st.sf;return`<div class="row"><h2 class="f">الطلاب</h2><button class="p" onclick="stuForm()">+ إضافة طالب</button></div><div class="card"><input placeholder="ابحث بالاسم أو الشيخ أو الكود أو الهاتف" value="${e(st.q)}" oninput="st.q=this.value;st.n=50;renderList()">
  <div class="row" style="margin-top:8px"><select class="f" onchange="st.sf.st=this.value;renderList()">${stOpts(f.st||'',SO)}</select><select class="f" onchange="st.sf.teacher=this.value;renderList()"><option value="">كل المشايخ</option>${tsel(f.teacher)}</select><select class="f" onchange="st.sf.tc=this.value;renderList()">${stOpts(f.tc||'',[['','عدد المشايخ: الكل'],['1','شيخ واحد'],['2','أكثر من شيخ']])}</select><select class="f" onchange="st.sf.gender=this.value;renderList()">${stOpts(f.gender||'',[['','بنين وبنات'],['ذكر','بنين'],['أنثى','بنات']])}</select><button onclick="st.sf={};st.q='';draw()">مسح</button></div><div id="ls"></div></div>`},
students_(){renderList()},
student(){const s=SS().find(x=>x.id===st.id);if(!s)return'<p>الطالب غير موجود</p>';const i=info(s);
  return`<button onclick="go('students')">→ رجوع</button><div class="card"><h2>${e(s.name)}</h2><div class="grid"><div>الكود: ${e(s.code)}</div><div>النوع: ${e(s.gender)}</div><div>الهاتف: ${e(s.phone)}</div></div>${s.notes?`<p class="mu">${e(s.notes)}</p>`:''}</div>
  <div class="card"><div class="big ${cls(i.st)}">${i.avg==null?'—':i.avg+'%'}</div><h3 class="${cls(i.st)}" style="text-align:center">${i.st}${i.n?` (${i.d} من ${i.n})`:''}</h3><p class="mu" style="text-align:center">النتيجة = متوسط درجات المشايخ، وتكتمل بعد اختبار كل شيخ</p>
  ${s.teacherIds.filter(tname).map(t=>{const v=s.evs[t];return`<div class="s"><div><b>${e(tname(t))}</b><div>${v?`<span class="${v.pct>=ST().pass?'ok':'no'}">${v.pct}%</span> — ${new Date(v.at).toLocaleDateString('ar-EG')}${v.note?`<div class="mu">${e(v.note)}</div>`:''}`:'<span class="mu">لم يختبره بعد</span>'}</div></div><button onclick="evForm('${s.id}','${t}')">${v?'تعديل':'تسجيل درجة'}</button></div>`}).join('')||'<p class="mu">لا يوجد مشايخ للطالب</p>'}</div>
  <div class="row"><button onclick="stuForm('${s.id}')">تعديل البيانات</button><button class="d" onclick="delStu('${s.id}')">حذف</button></div>`},
teachers(){return`<div class="row"><h2 class="f">المشايخ</h2><button class="p" onclick="tForm()">+ إضافة شيخ</button></div><div class="card" id="tl"></div>`},
teachers_(){tl()},
reports(){const f=st.f;return`<h2>التقارير</h2><div class="card"><input placeholder="بحث" value="${e(st.q)}" oninput="st.q=this.value;rep()"><div class="row" style="margin-top:8px"><select class="f" onchange="st.f.st=this.value;rep()">${stOpts(f.st||'',SO)}</select><select class="f" onchange="st.f.teacher=this.value;rep()"><option value="">كل المشايخ</option>${tsel(f.teacher)}</select><select class="f" onchange="st.f.gender=this.value;rep()">${stOpts(f.gender||'',[['','بنين وبنات'],['ذكر','بنين'],['أنثى','بنات']])}</select><button onclick="exXl()">Excel</button><button onclick="printRep()">طباعة / PDF</button></div></div><div class="card tw" id="rp"></div>`},
reports_(){rep()},
settings(){const s=ST();return`<h2>الإعدادات</h2><div class="card"><div class="grid">${[['name','اسم المسابقة'],['org','الجهة (تظهر في التقرير)'],['year','السنة'],['pass','نسبة النجاح %']].map(([k,l])=>`<div><label>${l}</label><input id="s_${k}" value="${e(s[k])}"></div>`).join('')}</div><button class="p" style="margin-top:12px" onclick="saveSet()">حفظ</button></div>
  <div class="card"><h3>نسخة احتياطية</h3><button onclick="backup('manual')">تنزيل نسخة احتياطية</button></div>
  <div class="card"><h3 class="no">منطقة الخطر</h3><p class="mu">حذف كل الطلاب والمشايخ نهائيًا (مع تنزيل نسخة تلقائيًا).</p><button class="d" onclick="wipeAll()">حذف كل البيانات</button></div>`}};
/* ===== شاشة الشيخ ===== */
function renderMy(){const t=st.my;if(!t||!$('#my'))return;const r=SS().filter(s=>s.teacherIds.includes(t)&&nn(s.name).includes(nn(st.q2))).sort(cmp),d=r.filter(s=>s.evs[t]).length;
  $('#my').innerHTML=`<p class="mu">${r.length} طالب — تم اختبار ${d} — متبقي ${r.length-d}</p>`+r.map(s=>{const v=s.evs[t];return`<div class="s"><div><b>${e(s.name)}</b><div>${v?`<span class="${v.pct>=ST().pass?'ok':'no'}">${v.pct}%</span>`:'<span class="mu">لم يُختبر</span>'}</div></div><button class="${v?'':'p'}" onclick="evForm('${s.id}','${t}')">${v?'تعديل الدرجة':'اختبار'}</button></div>`}).join('')}
/* كل شيخ بيكتب درجته في مسار خاص (evs/الشيخ) فمفيش شيخين بيمسحوا درجات بعض */
function evForm(sid,tid){const s=SS().find(x=>x.id===sid),v=s.evs[tid]||{};
  modal(`<h3>${e(s.name)}</h3><p class="mu">اختبار الشيخ: ${e(tname(tid))}</p><label>الدرجة (من 100)</label><input id="e_pct" type="number" min="0" max="100" step="0.5" value="${v.pct??''}" style="font-size:28px;text-align:center"><label>ملاحظات</label><textarea id="e_note" rows="3">${e(v.note||'')}</textarea><div class="row" style="margin-top:12px"><button class="p f" onclick="saveEv('${sid}','${tid}')">حفظ</button>${v.at?`<button class="d" onclick="delEv('${sid}','${tid}')">مسح الدرجة</button>`:''}<button onclick="closeM()">إلغاء</button></div>`);setTimeout(()=>$('#e_pct').focus(),50)}
function saveEv(sid,tid){const p=$('#e_pct').value;if(p===''||isNaN(p)||+p<0||+p>100)return tst('أدخل درجة صحيحة بين 0 و100',1);
  const s=SS().find(x=>x.id===sid),v={pct:+p,note:$('#e_note').value.trim(),by:tname(tid),at:new Date().toISOString()};s.evs[tid]=v;
  DB.w(DB.ref(`students/${sid}/evs/${tid}`).set(v));closeM();tst('تم حفظ الدرجة');rd()}
function delEv(sid,tid){delete SS().find(x=>x.id===sid).evs[tid];DB.w(DB.ref(`students/${sid}/evs/${tid}`).remove());closeM();rd()}
/* ===== الطلاب ===== */
function renderList(){const r=search(st.q,st.sf),p=r.slice(0,st.n);
  $('#ls').innerHTML=(p.map(s=>{const i=info(s);return`<div class="s"><div><b style="cursor:pointer" onclick="go('student','${s.id}')">${e(s.name)}</b><div class="mu">${e(s.code)} — ${e(s.gender)} — ${e(s.teacherIds.map(tname).filter(Boolean).join('، '))||'بدون شيخ'}${i.n>1?` <span class="wr">(${i.n} مشايخ)</span>`:''}</div></div><div class="row"><span class="${cls(i.st)}">${i.st}${i.avg!=null?' '+i.avg+'%':''}${i.st==='ناقص'?` (${i.d}/${i.n})`:''}</span><button onclick="go('student','${s.id}')">فتح</button></div></div>`}).join('')||'<p class="mu">لا توجد نتائج</p>')+`<div class="row" style="margin-top:10px"><span class="mu f">${r.length} طالب</span>${r.length>st.n?`<button onclick="st.n+=50;renderList()">عرض المزيد</button>`:''}</div>`}
function stuForm(id){const s=id?SS().find(x=>x.id===id):{gender:'ذكر',teacherIds:[]},i=(k,l)=>`<label>${l}</label><input id="f_${k}" value="${e(s[k]||'')}">`;
  modal(`<h3>${id?'تعديل الطالب':'إضافة طالب'}</h3>${i('name','الاسم بالكامل')}<label>النوع</label><select id="f_gender">${stOpts(s.gender,[['ذكر','ذكر'],['أنثى','أنثى']])}</select>${i('phone','رقم الهاتف')}${i('notes','ملاحظات')}<label>المشايخ (شيخ أو أكثر)</label><div id="f_tw"></div><button style="margin-top:6px" onclick="addTSel()">+ شيخ آخر</button>
  <div class="row" style="margin-top:14px"><button class="p" onclick="saveStu('${id||''}')">حفظ</button><button onclick="closeM()">إلغاء</button></div>`);(s.teacherIds.filter(tname).length?s.teacherIds.filter(tname):['']).forEach(t=>addTSel(t))}
function addTSel(sel){const d=document.createElement('div');d.className='row';d.style.marginTop='6px';d.innerHTML=`<select class="f f_t"><option value="">— اختر الشيخ —</option>${tsel(sel||'')}</select><button class="d" onclick="this.parentNode.remove()">✕</button>`;$('#f_tw').appendChild(d)}
async function saveStu(id){const g=k=>$('#f_'+k).value.trim(),x={name:g('name'),gender:g('gender'),phone:g('phone'),notes:g('notes'),teacherIds:[...new Set([...document.querySelectorAll('.f_t')].map(z=>z.value).filter(Boolean))]};
  if(!x.name)return tst('اكتب اسم الطالب',1);
  const d=SS().find(s=>s.id!==id&&nn(s.name)===nn(x.name));if(d&&!confirm('يوجد طالب بنفس الاسم ('+d.name+'). هل تريد الحفظ رغم ذلك؟'))return;
  let sid=id;
  if(id){Object.assign(SS().find(s=>s.id===id),x);DB.w(DB.ref('students/'+id).update(clean(x)))}
  else{const s=norm({...x,id:uid('S'),code:await DB.code(),reg:new Date().toISOString()});sid=s.id;SS().push(s);DB.w(DB.ref('students/'+s.id).set(clean(s)))}
  closeM();tst('تم الحفظ');go('student',sid)}
function delStu(id){conf('سيتم حذف الطالب ودرجاته.',()=>{DB.D.students=SS().filter(s=>s.id!==id);DB.w(DB.ref('students/'+id).remove());tst('تم الحذف');go('students')})}
/* ===== المشايخ ===== */
function tl(){const el=$('#tl');if(!el)return;el.innerHTML=[...TS()].sort((a,b)=>nn(a.name).localeCompare(nn(b.name),'ar')).map(t=>{const m=SS().filter(s=>s.teacherIds.includes(t.id)),d=m.filter(s=>s.evs[t.id]).length;
  return`<div class="s"><div><b>${e(t.name)}</b><div class="mu">${e(t.phone||'')} — ${m.length} طالب — اختبر ${d}</div></div><div class="row"><button onclick="st.my='${t.id}';try{localStorage.setItem('k_my','${t.id}')}catch(x){}go('my')">شاشته</button><button onclick="tForm('${t.id}')">تعديل</button><button class="d" onclick="delT('${t.id}')">حذف</button></div></div>`}).join('')||'<p class="mu">أضف المشايخ أولًا</p>'}
function tForm(id){const t=id?TS().find(x=>x.id===id):{};modal(`<h3>${id?'تعديل شيخ':'إضافة شيخ'}</h3><label>الاسم</label><input id="t_name" value="${e(t.name||'')}"><label>رقم الهاتف</label><input id="t_phone" value="${e(t.phone||'')}"><div class="row" style="margin-top:14px"><button class="p" onclick="saveT('${id||''}')">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
function saveT(id){const x={name:$('#t_name').value.trim(),phone:$('#t_phone').value.trim()};if(!x.name)return tst('اكتب اسم الشيخ',1);if(TS().some(t=>t.id!==id&&nn(t.name)===nn(x.name)))return tst('الشيخ مسجل بالفعل',1);
  if(id){Object.assign(TS().find(t=>t.id===id),x);DB.w(DB.ref('teachers/'+id).update(x))}else{const t={id:uid('T'),...x};TS().push(t);DB.w(DB.ref('teachers/'+t.id).set(t))}closeM();tst('تم الحفظ');rd()}
function delT(id){const n=SS().filter(s=>s.teacherIds.includes(id)).length;conf(`حذف الشيخ${n?` (له ${n} طالب، ودرجاته هتتشال من حساب نتائجهم)`:''}؟`,()=>{DB.D.teachers=TS().filter(t=>t.id!==id);DB.w(DB.ref('teachers/'+id).remove());tl()})}
/* ===== التقارير ===== */
function rep(){const r=search(st.q,st.f,'score'),el=$('#rp');if(!el)return;
  el.innerHTML=`<p class="mu">${r.length} طالب — مرتبين بالمتوسط من الأعلى</p><table><tr><th>م</th><th>الاسم</th><th>النوع</th><th>درجات المشايخ</th><th>المتوسط</th><th>الحالة</th></tr>${r.map((s,k)=>{const i=info(s);return`<tr><td>${k+1}</td><td>${e(s.name)}</td><td>${e(s.gender)}</td><td>${scs(s)}</td><td>${i.avg==null?'-':i.avg+'%'}</td><td class="${cls(i.st)}">${i.st}${i.st==='ناقص'?` (${i.d}/${i.n})`:''}</td></tr>`}).join('')}</table>`}
function exXl(){const T=[...TS()].sort((a,b)=>nn(a.name).localeCompare(nn(b.name),'ar')),r=search(st.q,st.f,'score').map(s=>{const i=info(s),o={'الاسم':s.name,'الكود':s.code,'النوع':s.gender,'عدد المشايخ':i.n};T.forEach(t=>o['الشيخ '+t.name]=s.teacherIds.includes(t.id)?(s.evs[t.id]?s.evs[t.id].pct:'لم يختبر'):'');o['المتوسط']=i.avg??'';o['الحالة']=i.st;return o});
  try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),'التقرير');XLSX.writeFile(wb,'report.xlsx')}catch(x){tst('تعذر التصدير',1)}}
async function printRep(){const r=search(st.q,st.f,'score');$('#pg').textContent='@page{size:A4 portrait;margin:11mm 10mm 13mm}';
  $('#pr').innerHTML=`<div class="rh"><div><small>${e(ST().org)}</small><h1>${e(ST().name)}</h1></div><div style="text-align:left"><h1>${e(ST().year)}</h1><small>تقرير النتائج</small></div></div><table><thead><tr><th>م</th><th>الاسم</th><th>درجات المشايخ</th><th>المتوسط</th><th>الحالة</th></tr></thead><tbody>${r.map((s,k)=>{const i=info(s);return`<tr><td>${k+1}</td><td><b>${e(s.name)}</b></td><td>${scs(s)}</td><td>${i.avg==null?'-':i.avg+'%'}</td><td>${i.st}</td></tr>`}).join('')}</tbody></table><div class="rd">${r.length} طالب — تاريخ الطباعة: ${new Date().toLocaleDateString('ar-EG')}</div>`;
  try{await document.fonts.load('700 20px Amiri','بسم')}catch(x){}window.print()}
/* ===== إعدادات ===== */
function saveSet(){const s=ST();['name','org'].forEach(k=>s[k]=$('#s_'+k).value);['year','pass'].forEach(k=>s[k]=+$('#s_'+k).value||0);if(s.pass<0||s.pass>100)return tst('نسبة النجاح بين 0 و100',1);DB.w(DB.ref('settings').set(clean(s)));tst('تم الحفظ');draw()}
function backup(t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({at:new Date().toISOString(),students:SS(),teachers:TS(),settings:ST()})],{type:'application/json'}));a.download=`katateeb-${t}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}
function wipeAll(){modal(`<h3 class="no">حذف كل البيانات</h3><p>هيتنزل نسخة احتياطية أولًا. اكتب كلمة <b>حذف</b> للتأكيد:</p><input id="wp"><div class="row" style="margin-top:14px"><button class="d" onclick="wipeGo()">حذف كل شيء</button><button onclick="closeM()">إلغاء</button></div>`)}
async function wipeGo(){if($('#wp').value.trim()!=='حذف')return tst('اكتب كلمة حذف',1);backup('before-wipe');
  try{await DB.ref('students').remove();await DB.ref('teachers').remove();DB.D.students=[];DB.D.teachers=[];closeM();tst('تم الحذف');go('home')}catch(x){tst('تعذر الحذف',1)}}
$('#mn').innerHTML='<p class="mu">جاري تحميل البيانات...</p>';
DB.load().then(draw).catch(()=>{$('#mn').innerHTML='<div class="card no">تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت ومن قواعد Realtime Database.</div>'});
</script></body></html>
